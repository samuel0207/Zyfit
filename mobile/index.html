<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZyFit">
    <meta name="description" content="ZyFit — Sua plataforma premium de evolução física. Acompanhe treinos, marque exercícios e evolua!">

    <title>ZyFit Mobile</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Mobile CSS -->
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <!-- Ambient Glow -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- ========================================== -->
    <!-- LOGIN SCREEN                               -->
    <!-- ========================================== -->
    <section id="login-screen" class="view active">
        <div class="login-container glass-card">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-dumbbell"></i>
                </div>
                <h1>ZY+<span>FIT</span></h1>
                <p>Sua plataforma premium de evolução física</p>
            </div>

            <form id="login-form" autocomplete="on">
                <div class="input-group">
                    <label for="login-phone">Telefone Celular</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-mobile-button input-icon"></i>
                        <input type="tel" id="login-phone" placeholder="Ex: 11999999999" required autocomplete="username">
                    </div>
                </div>

                <div class="input-group">
                    <label for="login-password">Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="toggle-password" class="password-toggle" aria-label="Mostrar senha">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="btn-login">
                    <span class="btn-text">Entrar</span>
                    <span class="spinner"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
                </button>
            </form>

            <div class="login-footer">
                <p><i class="fa-solid fa-shield-halved"></i> Conexão Segura e Criptografada</p>
            </div>
        </div>
    </section>

    <!-- ========================================== -->
    <!-- DASHBOARD SCREEN (STUDENT PORTAL)          -->
    <!-- ========================================== -->
    <section id="dashboard-screen" class="view">
        <!-- Mobile Header -->
        <header class="mobile-header">
            <div class="header-left">
                <div class="header-logo-icon">
                    <i class="fa-solid fa-dumbbell"></i>
                </div>
                <div>
                    <div class="header-title">ZY+<span>FIT</span></div>
                </div>
                <span class="header-badge">ALUNO</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="btn-notifications-mobile" class="btn-icon-mobile" title="Notificações" aria-label="Notificações" onclick="openMobileNotifications()">
                    <i class="fa-regular fa-bell"></i>
                    <span id="mobile-notification-badge" class="mobile-notification-badge hidden">0</span>
                </button>
                <button id="btn-logout-mobile" class="btn-logout" title="Sair" aria-label="Sair do sistema">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- Pull to refresh indicator -->
        <div id="pull-indicator" class="pull-indicator">
            <i class="fa-solid fa-arrow-down"></i>
            <span>Puxe para atualizar</span>
        </div>

        <!-- Hidden greeting for JS -->
        <span id="header-greeting" style="display:none"></span>

        <!-- Main Content Area -->
        <main id="app-content" class="app-content">
            <!-- Dynamic content rendered by JS -->
            <div class="skeleton skeleton-card" style="height:120px;margin-bottom:16px"></div>
            <div class="skeleton skeleton-card" style="height:70px;margin-bottom:16px"></div>
            <div class="skeleton skeleton-card" style="height:90px;margin-bottom:10px"></div>
            <div class="skeleton skeleton-card" style="height:90px;margin-bottom:10px"></div>
            <div class="skeleton skeleton-card" style="height:90px"></div>
        </main>
    </section>

    <!-- ========================================== -->
    <!-- NOTIFICATIONS MODAL (MOBILE)               -->
    <!-- ========================================== -->
    <div id="notifications-modal" class="modal-overlay">
        <div class="modal-box" style="max-height: 80vh; display: flex; flex-direction: column;">
            <div class="modal-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <i class="fa-regular fa-bell" style="color: var(--primary-color);"></i>
                    <h3 style="margin: 0; font-size: 1.1rem;">Notificações</h3>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button id="btn-mobile-mark-all" class="btn-mobile-read-all" onclick="markAllMobileNotificationsRead()">
                        <i class="fa-solid fa-check-double"></i> Ler todas
                    </button>
                    <button class="btn-close-modal" onclick="closeMobileNotifications()" aria-label="Fechar">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div id="mobile-notifications-list" class="mobile-notifications-list">
                <!-- Preenchido dinamicamente via JS -->
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIDEO MODAL                                -->
    <!-- ========================================== -->
    <div id="video-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="video-title">Demonstração</h3>
                <button id="btn-close-video" class="btn-close-modal" aria-label="Fechar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="video-wrapper" class="video-wrapper">
                <div id="video-container"></div>
            </div>
        </div>
    </div>

    <!-- App Script -->
    <script src="js/mobile-app.js"></script>
</body>
</html>
